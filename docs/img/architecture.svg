<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Architecture: a question goes through the Gateway to the RAG API, which searches pgvector, calls the models and sends its telemetry to the collector, then to Tempo, Loki and Prometheus, all read by Grafana.</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4a46"/>
    </marker>
    <style>
      .ns   { fill: #f2f5f3; stroke: #a9bab2; stroke-width: 1.2; }
      .box  { fill: #ffffff; stroke: #3d6b5c; stroke-width: 1.4; }
      .ext  { fill: #ffffff; stroke: #8a8a8a; stroke-width: 1.4; stroke-dasharray: 6 4; }
      .t    { font-size: 14px; font-weight: 600; fill: #1d2826; }
      .s    { font-size: 12px; fill: #4c5a56; }
      .ns-t { font-size: 12px; font-weight: 600; fill: #5d7169; letter-spacing: 0.3px; }
      .lbl  { font-size: 12px; fill: #2e3b37; }
      .line { stroke: #3b4a46; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .dot  { stroke: #3b4a46; stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="980" height="540" rx="10" fill="#ffffff"/>

  <!-- Outside the cluster -->
  <rect class="ext" x="20" y="92" width="150" height="60" rx="8"/>
  <text class="t" x="95" y="117" text-anchor="middle">You, or the</text>
  <text class="t" x="95" y="136" text-anchor="middle">load generator</text>

  <rect class="ext" x="20" y="300" width="170" height="92" rx="8"/>
  <text class="t" x="105" y="325" text-anchor="middle">Ollama on the host</text>
  <text class="s" x="105" y="345" text-anchor="middle">llama3.2:3b (answers)</text>
  <text class="s" x="105" y="362" text-anchor="middle">nomic-embed-text (search)</text>
  <text class="s" x="105" y="381" text-anchor="middle" font-style="italic">not needed with OVERLAY=fake</text>

  <!-- Cluster -->
  <rect x="210" y="20" width="755" height="440" rx="12" fill="none" stroke="#6f8a80" stroke-width="1.6" stroke-dasharray="8 5"/>
  <text class="ns-t" x="226" y="42">k3d CLUSTER · 1 control-plane node + 1 worker node, in Docker</text>

  <rect class="box" x="228" y="92" width="120" height="60" rx="8"/>
  <text class="t" x="288" y="117" text-anchor="middle">Gateway</text>
  <text class="s" x="288" y="136" text-anchor="middle">*.localhost:8080</text>

  <!-- namespace obslab -->
  <rect class="ns" x="380" y="58" width="265" height="165" rx="10"/>
  <text class="ns-t" x="392" y="77">APP · namespace obslab</text>
  <rect class="box" x="395" y="88" width="235" height="56" rx="8"/>
  <text class="t" x="512" y="111" text-anchor="middle">RAG API</text>
  <text class="s" x="512" y="130" text-anchor="middle">FastAPI + LangGraph · 2 replicas</text>
  <rect class="box" x="395" y="162" width="108" height="48" rx="8"/>
  <text class="t" x="449" y="182" text-anchor="middle">Ingest job</text>
  <text class="s" x="449" y="199" text-anchor="middle">notes to vectors</text>
  <rect class="box" x="522" y="162" width="108" height="48" rx="8"/>
  <text class="t" x="576" y="182" text-anchor="middle">PostgreSQL</text>
  <text class="s" x="576" y="199" text-anchor="middle">pgvector index</text>

  <!-- namespace monitoring -->
  <rect class="ns" x="680" y="58" width="270" height="120" rx="10"/>
  <text class="ns-t" x="692" y="77">PLATFORM · namespace monitoring</text>
  <rect class="box" x="693" y="88" width="112" height="72" rx="8"/>
  <text class="t" x="749" y="115" text-anchor="middle">Grafana</text>
  <text class="s" x="749" y="134" text-anchor="middle">dashboards,</text>
  <text class="s" x="749" y="149" text-anchor="middle">reads all 3 stores</text>
  <rect class="box" x="823" y="88" width="114" height="72" rx="8"/>
  <text class="t" x="880" y="115" text-anchor="middle">Prometheus</text>
  <text class="s" x="880" y="134" text-anchor="middle">metrics,</text>
  <text class="s" x="880" y="149" text-anchor="middle">SLO rules, alerts</text>

  <!-- namespace observability -->
  <rect class="ns" x="380" y="268" width="570" height="170" rx="10"/>
  <text class="ns-t" x="392" y="287">PLATFORM · namespace observability</text>
  <rect class="box" x="395" y="300" width="150" height="60" rx="8"/>
  <text class="t" x="470" y="325" text-anchor="middle">Loki</text>
  <text class="s" x="470" y="344" text-anchor="middle">logs</text>
  <rect class="box" x="600" y="300" width="150" height="60" rx="8"/>
  <text class="t" x="675" y="325" text-anchor="middle">Tempo</text>
  <text class="s" x="675" y="344" text-anchor="middle">traces</text>
  <rect class="box" x="800" y="300" width="137" height="60" rx="8"/>
  <text class="t" x="868" y="325" text-anchor="middle">OTel Collector</text>
  <text class="s" x="868" y="344" text-anchor="middle">adds pod metadata</text>

  <!-- Request path -->
  <path class="line" d="M170,122 L226,122"/>
  <text class="lbl" x="198" y="112" text-anchor="middle">question</text>
  <path class="line" d="M348,116 L393,116"/>
  <path class="line" d="M503,186 L520,186"/>
  <path class="line" d="M576,162 L576,147"/>

  <!-- Model calls -->
  <path class="line" d="M395,138 C330,210 260,250 192,318"/>
  <text class="lbl" x="232" y="226">embeddings + chat</text>

  <!-- Telemetry -->
  <path class="line" d="M630,116 C700,200 800,240 850,298"/>
  <text class="lbl" x="768" y="222">OTLP: traces,</text>
  <text class="lbl" x="768" y="237">metrics, logs</text>
  <path class="line" d="M800,330 L752,330"/>
  <text class="lbl" x="776" y="321" text-anchor="middle">spans</text>
  <path class="line" d="M868,362 L868,410 L470,410 L470,362"/>
  <text class="lbl" x="669" y="428" text-anchor="middle">log records (with trace_id)</text>
  <path class="line" d="M905,298 L905,162"/>
  <text class="lbl" x="912" y="222">metrics</text>
  <text class="lbl" x="912" y="237">scraped</text>

  <!-- Grafana reads -->
  <path class="dot" d="M805,124 L821,124"/>
  <path class="dot" d="M720,160 L690,298"/>
  <path class="dot" d="M705,160 C640,230 540,240 505,298"/>

  <!-- Legend -->
  <line x1="220" y1="492" x2="252" y2="492" class="line"/>
  <text class="s" x="260" y="496">data flow</text>
  <line x1="340" y1="492" x2="372" y2="492" class="dot"/>
  <text class="s" x="380" y="496">read by Grafana</text>
  <rect class="ext" x="505" y="482" width="30" height="20" rx="4"/>
  <text class="s" x="543" y="496">outside the cluster</text>
  <rect class="ns" x="670" y="482" width="30" height="20" rx="4"/>
  <text class="s" x="708" y="496">Kubernetes namespace</text>
</svg>
