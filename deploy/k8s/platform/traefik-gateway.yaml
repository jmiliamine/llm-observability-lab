# Turns the Traefik bundled with k3s into a Gateway API implementation.
#
# Why Gateway API and not Ingress: ingress-nginx reached end of life on
# 2026-03-24; Gateway API is the Kubernetes standard successor, portable across
# implementations (Traefik here, Envoy Gateway or a cloud load balancer elsewhere),
# and splits ownership cleanly: the platform owns the Gateway, apps own their HTTPRoutes.
#
# HelmChartConfig is k3s's way to override values of the charts it auto-installs.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesGateway:
        enabled: true          # watch Gateway / HTTPRoute objects
      kubernetesIngress:
        enabled: false         # one way to expose things, not two
    gateway:
      enabled: false           # we declare our own Gateway (gateway.yaml) to control who may attach
    gatewayClass:
      enabled: true            # creates the "traefik" GatewayClass
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {memory: 192Mi}
    logs:
      access:
        enabled: false         # access logs would flood Loki with probe/scrape noise locally
