# grafana-community/loki 18.13.5 (Loki 3.7) in Monolithic mode — one pod, filesystem storage.
# (Monolithic is the new name of SingleBinary; SimpleScalable is deprecated for Loki 4.)
#
# The chart's default is SimpleScalable + object storage + memcached caches: fine for a
# company with S3, ~2 GB of RAM too many here. Monolithic handles "a few tens of GB/day"
# per the chart docs, orders of magnitude above this lab. At scale: object storage + SimpleScalable.
deploymentMode: Monolithic

loki:
  auth_enabled: false            # single tenant; multi-tenancy (X-Scope-OrgID) is not needed here
  commonConfig:
    replication_factor: 1        # one replica, no quorum
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: loki_index_, period: 24h}
  limits_config:
    allow_structured_metadata: true   # required for OTLP ingestion (trace_id, span_id, attributes)
    volume_enabled: true
    retention_period: 72h             # same horizon as Prometheus
  compactor:
    retention_enabled: true           # actually delete data older than retention_period
    delete_request_store: filesystem
  pattern_ingester:
    enabled: false

singleBinary:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 512Mi}
  persistence:
    size: 2Gi
    storageClass: local-path

# Everything below is for scaled or cached deployments: switched off.
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
gateway: {enabled: false}        # the collector writes to the Loki Service directly
lokiCanary: {enabled: false}
test: {enabled: false}
minio: {enabled: false}
