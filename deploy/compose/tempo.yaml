# Tempo 3 single binary, same layout as the configuration the Helm chart renders for the cluster.
# (Tempo 3 has no `ingester` or `compactor` block any more; retention lives under
# `backend_scheduler`.)
stream_over_http_enabled: true
usage_report:
  reporting_enabled: false
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 72h
storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks
