# The collector is the only thing the app knows about. Swapping backends
# (Grafana Cloud, a cloud provider's tracing and metrics services) = changing exporters here.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch: {}

connectors:
  # RED metrics derived from spans: works for any span, even uninstrumented code paths.
  spanmetrics:
    histogram:
      explicit:
        buckets: [10ms, 40ms, 160ms, 640ms, 1.28s, 2.56s, 5.12s, 10.24s, 20.48s, 40.96s]
    dimensions:
      - name: gen_ai.operation.name
      - name: gen_ai.request.model
      - name: langgraph.node
    exemplars:
      enabled: true
    metrics_flush_interval: 15s

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    enable_open_metrics: true              # exemplars (metric -> trace links)
    resource_to_telemetry_conversion:
      enabled: true                        # service.name etc. become labels
  otlp/tempo:
    endpoint: tempo:4317
    tls: {insecure: true}
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, spanmetrics]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
